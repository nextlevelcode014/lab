name: Verificações do PR
run-name: "PR #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.head.sha }}"

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: verificacoes-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificações de PR
    runs-on: infra-ci
    env:
      FORGEJO_TOKEN: ""
      GITHUB_TOKEN: ""
    steps:
      - name: Buscar e verificar o SHA proposto
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
          LAB_GIT_URL: https://forge.nextlevelcode.pro/nextlevelcode/lab.git
          RUNNER_IMAGE_DIGEST: sha256:3c5b4fdee2e6f20062859c05b69415fbe81287f40ebfd311de88b69a947a776d
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: "0"
        run: |
          log=$(mktemp "${RUNNER_TEMP:-/tmp}/verificar-pr.XXXXXX")
          trap 'rm -f "$log"' EXIT
          # O subshell falha no primeiro erro. A saída também serve ao resumo.
          set +e
          (
            set -eu
            repo=$(mktemp -d "${RUNNER_TEMP:-/tmp}/checkout-pr.XXXXXX")
            trap 'rm -rf "$repo"' EXIT
            git -C "$repo" init -q
            # A ref do PR no lab também existe para propostas de forks.
            for tentativa in 1 2 3; do
              if git -C "$repo" fetch --atomic --no-tags "$LAB_GIT_URL" \
                "$BASE_SHA:refs/ci/base" "refs/pull/$PR_NUMERO/head:refs/ci/head"; then
                break
              fi
              if [ "$tentativa" -eq 3 ]; then
                exit 1
              fi
              sleep "$tentativa"
            done
            test "$(git -C "$repo" rev-parse refs/ci/base)" = "$BASE_SHA"
            test "$(git -C "$repo" rev-parse refs/ci/head)" = "$HEAD_SHA"
            git -C "$repo" checkout -q --detach "$HEAD_SHA"
            test "$(git -C "$repo" rev-parse HEAD)" = "$HEAD_SHA"
            printf 'Checkout conferido: %s\n' "$HEAD_SHA"
            cd "$repo"
            python3 --version
            terraform version
            ansible-playbook --version
            python3 verificar.py pr "$BASE_SHA" "$HEAD_SHA" \
              --colecoes /usr/share/ansible/collections
          ) 2>&1 | tee "$log"
          codigos=("${PIPESTATUS[@]}")
          resultado=${codigos[0]}
          if [ "$resultado" -eq 0 ]; then
            resultado=${codigos[1]}
          fi
          set -e
          {
            echo '# Verificações do PR'
            echo
            printf -- '- Base do evento: `%s`\n- Head do evento: `%s`\n' "$BASE_SHA" "$HEAD_SHA"
            printf -- '- Executor: label `infra-ci`, imagem `%s`, Forgejo Runner 13.2.1.\n' "$RUNNER_IMAGE_DIGEST"
            echo
            echo '## Seleção e resultado'
            echo
            echo 'O perfil pr seleciona pelo diff do ancestral comum com a base até o head. Alterações do workflow rodam todos os checks locais.'
            echo
            echo '~~~text'
            grep -E '^Checkout conferido:|^Perfil |^Experimentos:|^Terraform:|^\[.*\]|^Verificaç' "$log" || true
            echo '~~~'
            echo
            if [ "$resultado" -eq 0 ]; then
              echo 'Resultado: aprovado.'
            else
              echo "Resultado: falhou (código $resultado). Consulte o log do job."
            fi
            echo
            echo 'Escopo: checks locais em cópia versionada, sem backend Terraform ou inventário operacional.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$resultado"
