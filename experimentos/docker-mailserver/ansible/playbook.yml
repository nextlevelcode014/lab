---
- name: Preparar a VM do ensaio de e-mail
  hosts: docker_mailserver
  become: true
  gather_facts: false
  vars:
    dms_path: /srv/docker-mailserver

  tasks:
    - name: Esperar o SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Esperar o cloud-init terminar
      ansible.builtin.command: cloud-init status --wait --format json
      register: lab_cloud_init
      changed_when: false
      failed_when: >-
        lab_cloud_init.rc not in [0, 2]
        or (lab_cloud_init.stdout | from_json).errors | length > 0

    - name: Criar os diretórios de config do DNS
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/systemd/network/10-netplan-eth0.network.d
        - /etc/systemd/resolved.conf.d

    - name: Pôr o Quad9 e a Cloudflare com nome no eth0
      ansible.builtin.copy:
        dest: /etc/systemd/network/10-netplan-eth0.network.d/lab-dns.conf
        mode: "0644"
        content: |
          # Gerido pelo Ansible (experimento do lab).
          [Network]
          DNS=
          DNS=9.9.9.9#dns.quad9.net 1.1.1.1#cloudflare-dns.com 149.112.112.112#dns.quad9.net 1.0.0.1#cloudflare-dns.com
          DNSOverTLS=yes
      register: lab_dns_link

    - name: Exigir TLS no resolved
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/lab-dns.conf
        mode: "0644"
        content: |
          # Gerido pelo Ansible (experimento do lab).
          [Resolve]
          DNSOverTLS=yes
      register: lab_dns_resolved

    - name: Aplicar o DNS no eth0
      ansible.builtin.shell: networkctl reload && networkctl reconfigure eth0
      when: lab_dns_link is changed
      changed_when: true

    - name: Aplicar o DNS no resolved
      ansible.builtin.systemd_service:
        name: systemd-resolved
        state: restarted
      when: lab_dns_link is changed or lab_dns_resolved is changed

    - name: Instalar os pacotes do Ubuntu usados no ensaio
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - openssl
        update_cache: true
        cache_valid_time: 3600

    - name: Criar os diretórios do ensaio e proteger os dados
      ansible.builtin.file:
        path: "{{ dms_path }}/{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: "", mode: "0755" }
        - { path: dados, mode: "0700" }
        - { path: dados/tls, mode: "0700" }

    - name: Gerar o certificado autoassinado para o nome e IP de teste
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -newkey
          - rsa:2048
          - -noenc
          - -days
          - "30"
          - -subj
          - /CN=mail.example.test
          - -addext
          - subjectAltName=DNS:mail.example.test,IP:172.30.85.2
          - -keyout
          - "{{ dms_path }}/dados/tls/mail.key"
          - -out
          - "{{ dms_path }}/dados/tls/mail.crt"
        creates: "{{ dms_path }}/dados/tls/mail.crt"

    - name: Gravar o Compose e o cliente de teste
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ dms_path }}/{{ item }}"
        mode: "0644"
      loop:
        - compose.yml
        - testar.py
        - ensaiar-catch-all.sh
        - postfix-virtual.catch-all.cf
