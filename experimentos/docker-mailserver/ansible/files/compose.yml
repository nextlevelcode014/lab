services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:17.0.0@sha256:6cd2d4dbfb41ce3b8108968d266fb41b950ad27220979c67bda8a31bd1f6611d
    hostname: mail.example.test
    environment:
      SSL_TYPE: manual
      SSL_CERT_PATH: /certificados/mail.crt
      SSL_KEY_PATH: /certificados/mail.key
      ENABLE_RSPAMD: "0"
      ENABLE_AMAVIS: "0"
      ENABLE_OPENDKIM: "0"
      ENABLE_OPENDMARC: "0"
      ENABLE_POLICYD_SPF: "0"
      ENABLE_UPDATE_CHECK: "0"
    volumes:
      - ./dados/mail:/var/mail
      - ./dados/estado:/var/mail-state
      - ./dados/config:/tmp/docker-mailserver
      - ./dados/tls:/certificados:ro
    networks:
      correio:
        ipv4_address: ${DMS_ENSAIO_IPV4:-172.30.85.2}

networks:
  correio:
    internal: true
    ipam:
      config:
        - subnet: ${DMS_ENSAIO_SUBREDE:-172.30.85.0/24}
