---
- name: Recarregar units dos LXCs
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Aplicar DNS da interface dos LXCs
  ansible.builtin.command:
    argv: [networkctl, reload]
  changed_when: true

- name: Reiniciar resolvedor dos LXCs
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
