---
# Preferência declarada, não prioridade estrita nem retorno automático ao primeiro.
# IP + SNI oficial: sem bootstrap DNS para chegar ao DoT.
lxc_dns_servers:
  - 86.54.11.100#unfiltered.joindns4.eu
  - 1.1.1.1#one.one.one.one
lxc_dns_interface: eth0
lxc_dns_tailnet_enabled: "{{ 'staging' not in group_names }}"
lxc_dns_tailnet_domain: "{{ tailnet }}"
# Ponte padrão do Docker: não conflita com o AdGuard no IP LAN do pi-lab.
lxc_dns_docker_address: "{{ ansible_facts.docker0.ipv4.address | default('172.17.0.1') }}"
