---
# Audiobookshelf numa VM do lab: Tailscale com tag:lab (auth key efêmera, do
# vault do lab), Docker dos pacotes do Ubuntu e o app num compose. O
# Ansible chega à VM saltando pelo Proxmox (ansible.cfg); o painel e o app
# do celular, pela tailnet.
- name: Audiobookshelf no lab
  hosts: audiobookshelf
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../../vault.yml"
  vars:
    abs_versao: "2.37.2"
    abs_dir: /srv/audiobookshelf

  pre_tasks:
    - name: Exigir a auth key do Tailscale no vault
      ansible.builtin.assert:
        that: vault_tailscale_authkey is defined and vault_tailscale_authkey | length > 0
        fail_msg: >-
          Falta vault_tailscale_authkey no vault.yml da raiz do lab
          (docs/tailscale.md).
      run_once: true

    - name: Esperar o SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    # Mesmo motivo do experimento coolify: sem esperar, o apt briga pela
    # trava com o cloud-init. O rc 2 é só o aviso de `user:` DEPRECATED.
    - name: Esperar o cloud-init terminar
      ansible.builtin.command: cloud-init status --wait --format json
      register: lab_cloud_init
      changed_when: false
      failed_when: >-
        lab_cloud_init.rc not in [0, 2]
        or (lab_cloud_init.stdout | from_json).errors | length > 0

    # DNS por TLS (porta 853): Quad9 primeiro e Cloudflare de reserva. A
    # rede de casa já bloqueou o Quad9 inteiro (53, 853 e 443) e deixou a
    # Cloudflare passar; o resolved troca de servidor sozinho quando um
    # falha. Cifrado, a rede também não vê o que o lab consulta.
    #
    # Os servidores vão no link eth0, com o nome para validar o certificado
    # (#dns.quad9.net). O cloud-init já põe o Quad9 ali, mas sem nome, e o
    # resolved usa o servidor do link antes do global: com TLS e sem nome, a
    # consulta não completa. O DNS= vazio apaga a lista do netplan.
    - name: Criar os diretórios de config do DNS
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/systemd/network/10-netplan-eth0.network.d
        - /etc/systemd/resolved.conf.d

    - name: Pôr o Quad9 e a Cloudflare com nome no eth0
      ansible.builtin.copy:
        dest: /etc/systemd/network/10-netplan-eth0.network.d/lab-dns.conf
        mode: "0644"
        content: |
          # Gerido pelo Ansible (experimento do lab).
          [Network]
          DNS=
          DNS=9.9.9.9#dns.quad9.net 1.1.1.1#cloudflare-dns.com 149.112.112.112#dns.quad9.net 1.0.0.1#cloudflare-dns.com
          DNSOverTLS=yes
      register: lab_dns_link

    - name: Exigir TLS no resolved
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/lab-dns.conf
        mode: "0644"
        content: |
          # Gerido pelo Ansible (experimento do lab).
          [Resolve]
          DNSOverTLS=yes
      register: lab_dns_resolved

    - name: Aplicar o DNS no eth0
      ansible.builtin.shell: networkctl reload && networkctl reconfigure eth0
      when: lab_dns_link is changed
      changed_when: true

    - name: Aplicar o DNS no resolved
      ansible.builtin.systemd_service:
        name: systemd-resolved
        state: restarted
      when: lab_dns_link is changed or lab_dns_resolved is changed

    - name: Coletar fatos
      ansible.builtin.setup:

  roles:
    - role: artis3n.tailscale.machine
      vars:
        tailscale_authkey: "{{ vault_tailscale_authkey }}"
        # --accept-dns=false: o DNS da tailnet aponta primeiro para o AdGuard
        # do Pi, que a ACL não deixa o tag:lab alcançar; a VM fica no DNS
        # por TLS acima.
        tailscale_args: "--ssh --accept-dns=false --hostname={{ inventory_hostname }}"

  tasks:
    # Docker do próprio Ubuntu, não do repo da Docker: num lab descartável,
    # um pacote a menos para configurar vale mais que a versão mais nova.
    - name: Instalar o Docker e o compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        update_cache: true

    - name: Criar os diretórios do app
      ansible.builtin.file:
        path: "{{ abs_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: ["", config, metadata, audiobooks, podcasts]

    # O usuário lab escreve aqui sem sudo: é por onde o scp do README põe os
    # livros de teste.
    - name: Liberar a biblioteca para o usuário lab
      ansible.builtin.file:
        path: "{{ abs_dir }}/{{ item }}"
        owner: lab
        group: lab
      loop: [audiobooks, podcasts]

    - name: Gravar o compose
      ansible.builtin.template:
        src: compose.yml.j2
        dest: "{{ abs_dir }}/compose.yml"
        mode: "0644"

    - name: Subir o Audiobookshelf
      community.docker.docker_compose_v2:
        project_src: "{{ abs_dir }}"
        pull: missing

    - name: Esperar o app responder
      ansible.builtin.uri:
        url: http://127.0.0.1:13378/healthcheck
      register: abs_health
      until: abs_health.status == 200
      retries: 30
      delay: 2

    - name: Onde abrir
      ansible.builtin.debug:
        msg: >-
          Painel: http://{{ inventory_hostname }}:13378 (tailnet).
          Crie o usuário root AGORA: o primeiro acesso define a senha dele.
