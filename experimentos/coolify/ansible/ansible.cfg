[defaults]
inventory = inventory.yml
# O vault.yml da raiz do lab vem em todo playbook (vars_files).
ask_vault_pass = True
interpreter_python = auto_silent

[ssh_connection]
# VM recriada = host key nova no mesmo IP: aceita a primeira, recusa troca.
# Depois de um destroy/apply, `ssh-keygen -R <ip>` (README do experimento).
# A VM mora na vmbr2, só do Proxmox (ADR 0021 do infra): daqui não há rota
# até ela, então o SSH salta pelo Proxmox, pela tailnet. O root dele pede o
# "check" do Tailscale SSH: rode `ssh root@proxmox true` antes, ou o
# playbook parece travado (docs/proxmox.md).
ssh_args = -o StrictHostKeyChecking=accept-new -J root@proxmox
