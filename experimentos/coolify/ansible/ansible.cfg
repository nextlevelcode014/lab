[defaults]
inventory = inventory.yml
# O vault.yml da raiz do lab vem em todo playbook (vars_files).
ask_vault_pass = True
interpreter_python = auto_silent

[ssh_connection]
# VM recriada = host key nova no mesmo IP: aceita a primeira, recusa troca.
# Depois de um destroy/apply, `ssh-keygen -R <ip>` (README do experimento).
ssh_args = -o StrictHostKeyChecking=accept-new
