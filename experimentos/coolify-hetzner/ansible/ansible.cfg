[defaults]
inventory = inventory.yml
interpreter_python = auto_silent
# A passphrase do borg vem do vault.yml do lab. A auth key do Tailscale não:
# entra pelo cloud-init (terraform).
ask_vault_pass = true

[ssh_connection]
# VPS recriada = host key nova no mesmo nome da tailnet: aceita a primeira,
# recusa troca. Depois de um destroy/apply, `ssh-keygen -R` (README).
ssh_args = -o StrictHostKeyChecking=accept-new
